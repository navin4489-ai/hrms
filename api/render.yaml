# In Render, create a Blueprint and set its Blueprint file path to api/render.yaml.
# Render-managed Postgres is provisioned by this Blueprint. The free database expires after 30 days;
# use it only for a demo and do not store important HR data in it.
services:
  - type: web
    name: wintech-hrms-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: api/Dockerfile
    dockerContext: api
    healthCheckPath: /health
    disk:
      name: wintech-hrms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Database__Provider
        value: PostgreSql
      - key: Database__ConnectionString
        fromDatabase:
          name: wintech-hrms-db
          property: connectionString
      - key: Database__Seed
        value: "true"
      - key: Database__ExitOnInitializationFailure
        value: "true"
      - key: FileStorage__Root
        value: /var/data/files
      - key: Jwt__SigningKey
        generateValue: true
      - key: Security__SeedDemoPassword
        generateValue: true

databases:
  - name: wintech-hrms-db
    databaseName: wintech_hrms
    user: wintech_hrms
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
